<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .paper { fill: #f4efe6; }
    .ink   { fill: #17171a; }
    .accent{ fill: #b8552a; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #121316; }
      .ink   { fill: #e8e6df; }
      .accent{ fill: #d97757; }
    }
  </style>
  <rect class="paper" width="64" height="64" rx="6" />
  <!-- Serif 'M' rendered as a path so it renders identically without the font. -->
  <path class="ink" d="
    M10 50 L10 14 L18 14 L32 38 L46 14 L54 14 L54 50 L47 50 L47 26 L34 48 L30 48 L17 26 L17 50 Z
  "/>
  <!-- Accent colophon dot -->
  <circle class="accent" cx="52" cy="16" r="4" />
</svg>
