      (function () {
        var BLUR = 'guards-blur';
        var devtoolsOpen = false;

        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

        document.addEventListener('keydown', function (e) {
          var k = e.key;
          var u = k.length === 1 ? k.toUpperCase() : k;
          var cm = e.ctrlKey || e.metaKey;
          var sh = e.shiftKey;
          if (k === 'F12') { e.preventDefault(); return; }
          if (cm && sh && ['I', 'J', 'C', 'K'].indexOf(u) !== -1) { e.preventDefault(); return; }
          if (cm && ['U', 'S', 'P', 'A', 'C', 'X'].indexOf(u) !== -1) { e.preventDefault(); return; }
          if (k === 'PrintScreen' || k === 'F13') {
            try { navigator.clipboard && navigator.clipboard.writeText(''); } catch (_) {}
            if (document.body) {
              document.body.classList.add(BLUR);
              setTimeout(function () {
                if (!devtoolsOpen && document.body) document.body.classList.remove(BLUR);
              }, 1500);
            }
          }
        });

        document.addEventListener('copy', function (e) { e.preventDefault(); });
        document.addEventListener('cut', function (e) { e.preventDefault(); });
        document.addEventListener('dragstart', function (e) { e.preventDefault(); });
        document.addEventListener('selectstart', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
          e.preventDefault();
        });

        // DevTools size-delta detector — polls every 500ms, blurs body when open.
        function detectDevtools() {
          var wDelta = Math.abs(window.outerWidth - window.innerWidth);
          var hDelta = Math.abs(window.outerHeight - window.innerHeight);
          var open = wDelta > 160 || hDelta > 160;
          if (open !== devtoolsOpen) {
            devtoolsOpen = open;
            if (document.body) {
              document.body.classList.toggle(BLUR, open);
            }
          }
        }
        setInterval(detectDevtools, 500);
        detectDevtools();
      })();
    </script>

<body>
<div id="root">
    <style>
        /* Inline entry screen — painted before JS/CSS loads. React mounts only
           after the user clicks the enter button (or its fallback handler). */
        html, body {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        img, svg, video {
            -webkit-user-drag: none;
            user-drag: none;
        }
        body.guards-blur > *:not(.site-entry) {
            filter: blur(14px) saturate(0.4);
            transition: filter 160ms ease-out;
            pointer-events: none;
        }
        body.guards-blur .site-entry {
            filter: blur(14px) saturate(0.4);
            transition: filter 160ms ease-out;
        }
        @media print {
            html, body { display: none !important; visibility: hidden !important; }
        }

        .site-entry {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4efe6;
            color: #16181d;
            font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
            z-index: 9999;
            isolation: isolate;
        }
        html.dark .site-entry { background: #121316; color: #e6e0d0; }

        /* Engineering grid + glyph watermark (matches SiteWatermark post-mount). */
        .site-entry__watermark {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            color: inherit;
        }
        .site-entry__watermark::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.7;
            background-image:
                linear-gradient(currentColor 1px, transparent 1px),
                linear-gradient(90deg, currentColor 1px, transparent 1px),
                linear-gradient(currentColor 1px, transparent 1px),
                linear-gradient(90deg, currentColor 1px, transparent 1px);
            background-size: 16px 16px, 16px 16px, 64px 64px, 64px 64px;
            mix-blend-mode: normal;
            filter: opacity(0.035);
        }
        .sew {
            position: absolute;
            color: inherit;
            opacity: 0.06;
        }
        .sew--sine     { top: 70px;   right: 16px; width: 180px; }
        .sew--chain    { top: 50%;    left: 12px; width: 220px; transform: translateY(-50%); }
        .sew--integral { bottom: 48px; right: 24px; width: 160px; }
        .sew--neural   { bottom: 140px; left: 20px; width: 120px; }
        @media (max-width: 768px) {
            .sew { display: none; }
        }

        .site-entry__stage {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        /* Theme toggle in corner of entry gate. */
        .site-entry__theme {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2;
            width: 36px;
            height: 36px;
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            cursor: pointer;
            opacity: 0.55;
            display: grid;
            place-items: center;
            padding: 0;
            transition: opacity 160ms ease, background 160ms ease, color 160ms ease;
        }
        .site-entry__theme:hover { opacity: 1; }
        .site-entry__theme:focus-visible {
            outline: 2px solid #b8552a;
            outline-offset: 3px;
            opacity: 1;
        }
        .site-entry__theme svg { width: 16px; height: 16px; display: block; }
        .site-entry__theme .icon-sun { display: none; }
        .site-entry__theme .icon-moon { display: block; }
        html.dark .site-entry__theme .icon-sun { display: block; }
        html.dark .site-entry__theme .icon-moon { display: none; }

        .site-entry__folio {
            font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #b8552a;
            opacity: 0;
            animation: se-fade 600ms ease-out 120ms forwards;
        }
        html.dark .site-entry__folio { color: #d1784a; }

        .site-entry__name {
            font-size: clamp(30px, 6vw, 54px);
            font-weight: 400;
            letter-spacing: -0.025em;
            line-height: 1;
            text-align: center;
            margin: 0;
            opacity: 0;
            transform: translateY(10px);
            animation: se-name 1100ms cubic-bezier(.2,.7,.2,1) 320ms forwards;
        }

        .site-entry__rule {
            width: 0;
            height: 1.5px;
            background: #b8552a;
            border-radius: 1px;
            animation: se-rule 1800ms cubic-bezier(.25,1,.5,1) 720ms forwards;
        }
        html.dark .site-entry__rule { background: #d1784a; }

        .site-entry__tagline {
            font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-size: clamp(13px, 1.6vw, 16px);
            color: #5a5a5a;
            text-align: center;
            max-width: 44ch;
            line-height: 1.5;
            opacity: 0;
            animation: se-fade 700ms ease-out 1800ms forwards;
        }
        html.dark .site-entry__tagline { color: #a0a0a0; }

        .site-entry__dots {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #7a7a7a;
            opacity: 0;
            animation: se-fade 500ms ease-out 2500ms forwards;
        }
        html.dark .site-entry__dots { color: #9a9a9a; }

        .site-entry__dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            animation: se-blink 1200ms ease-in-out infinite;
        }
        .site-entry__dot:nth-of-type(2) { animation-delay: 160ms; }
        .site-entry__dot:nth-of-type(3) { animation-delay: 320ms; }
        .site-entry__label { margin-left: 4px; }

        .site-entry__enter {
            margin-top: 14px;
            padding: 12px 26px;
            background: transparent;
            color: #16181d;
            border: 1px solid #16181d;
            font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: background 180ms ease, color 180ms ease, transform 180ms ease;
            animation: se-enter 700ms cubic-bezier(.2,.7,.2,1) 3200ms forwards;
        }
        .site-entry__enter:hover {
            background: #16181d;
            color: #f4efe6;
        }
        .site-entry__enter:focus-visible {
            outline: 2px solid #b8552a;
            outline-offset: 3px;
        }
        html.dark .site-entry__enter { color: #e6e0d0; border-color: #e6e0d0; }
        html.dark .site-entry__enter:hover { background: #e6e0d0; color: #121316; }
        .site-entry__enter .se-arrow {
            display: inline-block;
            margin-left: 10px;
            transition: transform 200ms cubic-bezier(.2,.7,.2,1);
        }
        .site-entry__enter:hover .se-arrow { transform: translateX(4px); }

        @keyframes se-fade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes se-name {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes se-rule {
            from { width: 0; }
            to   { width: min(340px, 60vw); }
        }
        @keyframes se-blink {
            0%, 60%, 100% { opacity: 0.28; transform: scale(1); }
            25%           { opacity: 1;    transform: scale(1.2); }
        }
        @keyframes se-enter {
            0%   { opacity: 0; transform: translateY(8px); pointer-events: none; }
            100% { opacity: 1; transform: translateY(0);   pointer-events: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            .site-entry__folio,
            .site-entry__name,
            .site-entry__rule,
            .site-entry__tagline,
            .site-entry__dots,
            .site-entry__dot,
            .site-entry__enter {
                animation: none;
                opacity: 1;
                transform: none;
                pointer-events: auto;
            }
            .site-entry__rule { width: min(340px, 60vw); }
            .site-entry__dot  { opacity: 0.6; }
        }
    </style>

    <script>
      (function () {
        var btn = document.getElementById('siteEntryEnter');
        if (btn) {
          btn.addEventListener('click', function () {
            window.__entryClicked = true;
            window.dispatchEvent(new Event('entry-enter'));
          });
          // Focus the button once it becomes interactive so Enter key activates it.
          window.setTimeout(function () { try { btn.focus({ preventScroll: true }); } catch (_) {} }, 3400);
        }

        var themeBtn = document.getElementById('siteEntryTheme');
        if (themeBtn) {
          themeBtn.addEventListener('click', function () {
            var isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (_) {}
          });
        }
      })();
